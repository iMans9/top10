<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Top10 | توب10</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --success: #27ae60;
            --light: #ecf0f1;
            --gold: #f1c40f;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-attachment: fixed;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--primary);
        }

        #game-container {
            background: rgba(255, 255, 255, 0.95);
            width: 95%;
            max-width: 800px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 { font-weight: 900; color: var(--primary); margin-bottom: 10px; }
        .category-badge { background: var(--secondary); color: white; padding: 5px 15px; border-radius: 50px; font-size: 0.9rem; }

        #setup-screen, #game-screen, #result-screen { display: none; }
        #setup-screen.active, #game-screen.active, #result-screen.active { display: block; }

        .btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            transition: 0.3s;
            margin: 10px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn-hint { background: var(--gold); color: #333; }

        #question-text { font-size: 1.5rem; margin: 25px 0; color: #333; line-height: 1.6; }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.1rem;
            outline: none;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .answer-slot {
            background: #f8f9fa;
            border: 2px dashed #ccc;
            padding: 15px;
            border-radius: 10px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            transition: 0.5s;
        }

        .answer-slot.revealed {
            border-style: solid;
            border-color: var(--success);
            background: #e8f5e9;
            animation: pop 0.3s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .info-text { font-size: 0.8rem; color: #7f8c8d; font-weight: 400; }
        #hint-box { color: var(--accent); font-style: italic; margin-top: 10px; min-height: 24px; }

        .score-board { display: flex; justify-content: space-around; margin-bottom: 20px; background: #eee; padding: 10px; border-radius: 10px; }

        @media (max-width: 600px) {
            .answers-grid { grid-template-columns: 1fr; }
            #question-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="setup-screen" class="active">
        <h1>🎮 MANS GAMES</h1>
        <p>اختر الفئة التي تريد اللعب بها:</p>
        <div id="categories">
            <button class="btn" onclick="startGame('السعودية')">المملكة العربية السعودية</button>
            <button class="btn" onclick="startGame('اختراعات')">اختراعات</button>
            <button class="btn" onclick="startGame('آثار')">آثار ومعالم</button>
            <button class="btn" onclick="startGame('حيوانات')">عالم الحيوان</button>
            <button class="btn" onclick="startGame('جسم الإنسان')">جسم الإنسان</button>
        </div>
    </div>

    <div id="game-screen">
        <span class="category-badge" id="current-cat">السعودية</span>
        <div class="score-board">
            <div>النقاط: <span id="current-score">0</span></div>
            <div>المتبقي: <span id="rem-answers">10</span></div>
        </div>
        
        <div id="question-text">تحميل السؤال...</div>
        
        <div class="input-group">
            <input type="text" id="user-input" placeholder="اكتب إجابتك هنا..." autocomplete="off">
            <button class="btn" onclick="checkAnswer()">إرسال</button>
        </div>
        
        <button class="btn btn-hint" onclick="showHint()">💡 تلميح (خصم نقطة)</button>
        <div id="hint-box"></div>

        <div class="answers-grid" id="answers-grid">
            </div>
    </div>

    <div id="result-screen">
        <h2>انتهت الجولة!</h2>
        <h1 id="final-score">0</h1>
        <p>نقطة</p>
        <button class="btn" onclick="location.reload()">اللعب مرة أخرى</button>
    </div>
</div>

<script>
    let allQuestions = [];
    let currentQuestion = null;
    let score = 0;
    let revealedCount = 0;
    let hintsShown = 0;

    // تحميل ملف JSON
    async function loadData() {
        try {
            const response = await fetch('questions.json');
            allQuestions = await response.json();
        } catch (e) {
            alert('خطأ في تحميل ملف الأسئلة. تأكد من وجود ملف questions.json في نفس المجلد');
        }
    }

    function startGame(category) {
        const filtered = allQuestions.filter(q => q.category === category);
        if(filtered.length === 0) return alert('لا توجد أسئلة لهذه الفئة حالياً');
        
        currentQuestion = filtered[Math.floor(Math.random() * filtered.length)];
        
        document.getElementById('setup-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        
        setupBoard();
    }

    function setupBoard() {
        revealedCount = 0;
        hintsShown = 0;
        document.getElementById('current-cat').innerText = currentQuestion.category;
        document.getElementById('question-text').innerText = currentQuestion.q;
        document.getElementById('hint-box').innerText = "";
        
        const grid = document.getElementById('answers-grid');
        grid.innerHTML = "";
        
        for (let i = 1; i <= 10; i++) {
            const div = document.createElement('div');
            div.className = "answer-slot";
            div.id = `slot-${i}`;
            div.innerHTML = `<span>${i}</span>`;
            grid.appendChild(div);
        }
        
        document.getElementById('user-input').focus();
    }

    function checkAnswer() {
        const input = document.getElementById('user-input').value.trim();
        if (!input) return;

        let found = false;
        currentQuestion.a.forEach(item => {
            const slot = document.getElementById(`slot-${item.p}`);
            // التحقق من الإجابة (مقارنة مع الكلمات المفتاحية k)
            if (item.k.some(key => input.includes(key)) && !slot.classList.contains('revealed')) {
                slot.classList.add('revealed');
                slot.innerHTML = `
                    <div>${item.k[0]} <br> <span class="info-text">${item.i}</span></div>
                    <span>#${item.p}</span>
                `;
                score += (11 - item.p); // نقاط أكثر للمراكز الأولى
                revealedCount++;
                found = true;
            }
        });

        if (found) {
            document.getElementById('current-score').innerText = score;
            document.getElementById('rem-answers').innerText = 10 - revealedCount;
            if (revealedCount === 10) endGame();
        }
        
        document.getElementById('user-input').value = "";
        document.getElementById('user-input').focus();
    }

    function showHint() {
        if (hintsShown >= 10) return;
        const nextHintIndex = hintsShown;
        const hintText = currentQuestion.a[nextHintIndex].h;
        document.getElementById('hint-box').innerText = `تلميح للمركز ${nextHintIndex + 1}: ${hintText}`;
        score = Math.max(0, score - 1);
        document.getElementById('current-score').innerText = score;
        hintsShown++;
    }

    function endGame() {
        setTimeout(() => {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            document.getElementById('final-score').innerText = score;
        }, 1500);
    }

    // تشغيل التحقق عند ضغط Enter
    document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkAnswer();
    });

    loadData();
</script>

</body>
</html>
